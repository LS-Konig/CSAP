project:
  type: manuscript
  resources:
    - robots.txt
  render:
    - index.qmd
    - code/01_preparation/1.1_ess_to_parquet.qmd
    - code/01_preparation/1.2_ess_partyfacts.qmd
    - code/01_preparation/1.3_cses_partyfacts.qmd
    - code/01_preparation/1.4_ees_partyfacts.qmd
    - code/01_preparation/1.5_ees_pid_over_time.qmd
    - code/01_preparation/1.6_cses_pid_over_time.qmd
    - code/01_preparation/1.7_ess_pid_over_time.qmd
    - code/01_preparation/1.9_party_alliances.qmd
    # Rendered as plain pages, deliberately not listed under manuscript:
    # notebooks. The manuscript pipeline routes notebooks through .ipynb,
    # which turns `output: asis` into a code block, so their generated
    # tabsets and Mermaid trees would not render. Output lands next to the
    # source (git-ignored *.html); the post-render script copies it into
    # _manuscript/code/02_composition/.
    - code/02_composition/2.1_eu25_composition.qmd
    - code/02_composition/2.2_ees_composition.qmd
    - code/02_composition/2.3_cses_composition.qmd
    - code/02_composition/2.4_ess_composition.qmd
    - code/03_analyses/3.1_eu25_prep.qmd
  # Copies frozen figures and the plain composition pages into _manuscript/
  post-render:
    - code/00_helper/post_render.R

# Only the notebooks listed here are rendered by the project. Without this block
# Quarto auto-discovers every .qmd and .md in the tree, including data provenance
# stubs and the deck. Add a notebook here to include it.
manuscript:
  article: index.qmd
  notebooks:
    - notebook: code/01_preparation/1.1_ess_to_parquet.qmd
      title: ESS to Parquet
    - notebook: code/01_preparation/1.2_ess_partyfacts.qmd
      title: ESS Party Facts
    - notebook: code/01_preparation/1.3_cses_partyfacts.qmd
      title: CSES Party Facts
    - notebook: code/01_preparation/1.4_ees_partyfacts.qmd
      title: EES Party Facts
    - notebook: code/01_preparation/1.5_ees_pid_over_time.qmd
      title: EES PID over Time
    - notebook: code/01_preparation/1.6_cses_pid_over_time.qmd
      title: CSES PID over Time
    - notebook: code/01_preparation/1.7_ess_pid_over_time.qmd
      title: ESS PID over Time
    - notebook: code/01_preparation/1.9_party_alliances.qmd
      title: Party Alliances
    - notebook: code/01_preparation/1.8_eu25_pid.qmd
      title: EU25 PID
    - notebook: code/03_analyses/3.1_eu25_prep.qmd
      title: EU25 Prep

execute:
  freeze: auto

author:
  - name: Tristan Muno
    orcid: 0009-0002-3078-8436
    email: tristan.muno@uni-mannheim.de
    affiliations: 
      - name: University of Mannheim
        address: A 5, 6 – Raum A 351
        city: Mannheim
        state: BW
        postal-code: 68159

bibliography: references.bib
biblio-style: apsr
link-citations: true
number-sections: true
date: last-modified
date-format: MMMM D, YYYY

format:
  html:
    toc: true
    toc-depth: 3
    include-in-header:
      text:
        <meta name="robots" content="noindex">
  pdf:
    code-links: false
    toc: false
    toc-depth: 3
    include-in-header:
      text: |
        \usepackage{setspace}
        \setlength{\parindent}{15pt}
        \usepackage[font=footnotesize]{caption}
    thanks: |
      Do not share without consent.
      Wordcount: 9040.
    papersize: a4
    fontsize: 12pt
    linestretch: 2
    geometry:
      - top = 2cm
      - bottom = 2cm
      - left = 2.5cm
      - right = 2.5cm
      - footskip = 20pt
  docx: default