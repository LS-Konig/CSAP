project:
  type: manuscript
  resources:
    - robots.txt
  render:
    - index.qmd
    - code/01_prep/1.01_ess_parquet.qmd
    - code/01_prep/1.02_ess_partyfacts.qmd
    - code/01_prep/1.03_cses_partyfacts.qmd
    - code/01_prep/1.04_ees_partyfacts.qmd
    - code/01_prep/1.05_ees_pid-trend.qmd
    - code/01_prep/1.06_cses_pid-trend.qmd
    - code/01_prep/1.07_ess_pid-trend.qmd
    - code/01_prep/1.09_all_match.qmd
    # Rendered as plain pages, deliberately not listed under manuscript:
    # notebooks. The manuscript pipeline routes notebooks through .ipynb,
    # which turns `output: asis` into a code block, so their generated
    # tabsets and Mermaid trees would not render. Output lands next to the
    # source (git-ignored *.html); the post-render script copies it into
    # _manuscript/code/<folder>/.
    - code/02_types/2.01_eu25_types.qmd
    - code/02_types/2.02_ees_types.qmd
    - code/02_types/2.03_cses_types.qmd
    - code/02_types/2.04_ess_types.qmd
    - code/rq1_who/r1.01_all_cells.qmd
    - code/rq2_what/r2.01_eu25_prep.qmd
  # Copies frozen figures and the plain composition pages into _manuscript/
  post-render:
    - code/00_helper/post_render.R

# Only the notebooks listed here are rendered by the project. Without this block
# Quarto auto-discovers every .qmd and .md in the tree, including data provenance
# stubs and the deck. Add a notebook here to include it.
manuscript:
  article: index.qmd
  notebooks:
    - notebook: code/01_prep/1.01_ess_parquet.qmd
      title: ESS to Parquet
    - notebook: code/01_prep/1.02_ess_partyfacts.qmd
      title: ESS Party Facts
    - notebook: code/01_prep/1.03_cses_partyfacts.qmd
      title: CSES Party Facts
    - notebook: code/01_prep/1.04_ees_partyfacts.qmd
      title: EES Party Facts
    - notebook: code/01_prep/1.05_ees_pid-trend.qmd
      title: EES PID over Time
    - notebook: code/01_prep/1.06_cses_pid-trend.qmd
      title: CSES PID over Time
    - notebook: code/01_prep/1.07_ess_pid-trend.qmd
      title: ESS PID over Time
    - notebook: code/01_prep/1.09_all_match.qmd
      title: Party Matching
    - notebook: code/01_prep/1.08_eu25_pid.qmd
      title: EU25 PID
    - notebook: code/rq2_what/r2.01_eu25_prep.qmd
      title: EU25 Prep

execute:
  freeze: auto

author:
  - name: Tristan Muno
    orcid: 0009-0002-3078-8436
    email: tristan.muno@uni-mannheim.de
    affiliations: 
      - name: University of Mannheim
        address: A 5, 6 – Raum A 351
        city: Mannheim
        state: BW
        postal-code: 68159

bibliography: references.bib
biblio-style: apsr
link-citations: true
number-sections: true
date: last-modified
date-format: MMMM D, YYYY

format:
  html:
    toc: true
    toc-depth: 3
    include-in-header:
      text:
        <meta name="robots" content="noindex">
  pdf:
    code-links: false
    toc: false
    toc-depth: 3
    include-in-header:
      text: |
        \usepackage{setspace}
        \setlength{\parindent}{15pt}
        \usepackage[font=footnotesize]{caption}
    thanks: |
      Do not share without consent.
      Wordcount: 9040.
    papersize: a4
    fontsize: 12pt
    linestretch: 2
    geometry:
      - top = 2cm
      - bottom = 2cm
      - left = 2.5cm
      - right = 2.5cm
      - footskip = 20pt
  docx: default